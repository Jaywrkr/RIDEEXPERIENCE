<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Panel administrativo — Ingreso</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="centro-pantalla">
    <form class="tarjeta tarjeta-login" id="form-login" novalidate>
      <h1>Panel administrativo</h1>
      <p class="subtitulo">Ingresa con tu cuenta de organizador para gestionar el evento.</p>

      <div class="mensaje-error" id="mensaje-error"></div>

      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" autocomplete="username" required />
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>

      <button type="submit" class="boton-primario" id="boton-login">Ingresar</button>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
